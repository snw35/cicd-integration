name: Integration Update

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:
    inputs:
      cicd_ref:
        description: Ref (branch or tag) for snw35/cicd workflows and helper scripts.
        required: false
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: write
  packages: write

jobs:
  update:
    uses: snw35/cicd/.github/workflows/github.yaml@52ef4cf05425952ffab715211ec8ce0b5321710e
    with:
      TARGETS_JSON: >-
        [{"name":"root","workdir":".","image_tag":"SAMPLE_VERSION"},{"name":"secondary","workdir":"secondary","image_tag":"SECONDARY_VERSION"}]
      CICD_REF: ${{ inputs.cicd_ref || vars.CICD_REF || 'main' }}
      RUN_AUTOMATED_UPDATE_ON_PR: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  create-release:
    needs: update
    if: github.ref_name == github.event.repository.default_branch && needs.update.outputs.changed == 'true'
    uses: snw35/cicd/.github/workflows/create-release.yaml@52ef4cf05425952ffab715211ec8ce0b5321710e
    with:
      targets_json: ${{ needs.update.outputs.targets }}
      CICD_REF: ${{ inputs.cicd_ref || vars.CICD_REF || 'main' }}
    secrets: inherit
