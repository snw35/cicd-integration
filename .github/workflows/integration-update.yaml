name: Integration Update

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:
    inputs:
      cicd_ref:
        description: Ref (branch or tag) for snw35/cicd workflows and helper scripts.
        required: false
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  container-update:
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || format('container-update-{0}', github.repository) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      actions: read
    uses: snw35/cicd/.github/workflows/container-update.yaml@main
    with:
      WORKDIRS: '[".","secondary"]'
      IMAGE_TAG: SAMPLE_VERSION
      IMAGE_TAG_BY_WORKDIR: '{"secondary":"SECONDARY_VERSION"}'
      CICD_REF: ${{ inputs.cicd_ref || vars.CICD_REF || 'main' }}
      RUN_AUTOMATED_UPDATE_ON_PR: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
