name: Verify and Reset

on:
  workflow_run:
    workflows: ["Integration Update"]
    types: [completed]

permissions:
  contents: write

jobs:
  verify-reset:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASELINE_REF: ${{ vars.BASELINE_REF != '' && vars.BASELINE_REF || 'baseline' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve baseline ref
        id: baseline
        run: |
          git fetch --tags origin
          git fetch origin "${BASELINE_REF}" --depth=1 || true
          if git rev-parse --verify --quiet "origin/${BASELINE_REF}^{commit}"; then
            echo "ref=origin/${BASELINE_REF}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "${BASELINE_REF}^{commit}"; then
            echo "ref=${BASELINE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "Baseline ref '${BASELINE_REF}' not found."
            exit 1
          fi
      - name: Check for changes since baseline
        id: diff
        run: |
          if git diff --quiet "${{ steps.baseline.outputs.ref }}...HEAD"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify updated versions
        if: steps.diff.outputs.changed == 'true'
        run: python3 .github/scripts/verify_updated_versions.py
      - name: Delete update release and tags
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(git tag --points-at HEAD)"
          if [ -z "$tags" ]; then
            echo "No tags found on update commit."
            exit 0
          fi
          for tag in $tags; do
            echo "Deleting release/tag $tag"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
            else
              echo "Release for tag '$tag' not found; deleting tag only."
              git push --delete origin "$tag"
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true
          done
      - name: Reset default branch to baseline
        if: steps.diff.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git checkout -B "${DEFAULT_BRANCH}" "${{ steps.baseline.outputs.ref }}"
          git push --force origin "${DEFAULT_BRANCH}"
