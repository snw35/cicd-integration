name: Verify and Reset

on:
  workflow_run:
    workflows: ["Integration Update"]
    types: [completed]

permissions:
  contents: write
  packages: read
  actions: read

jobs:
  verify-reset:
    # Only runs that executed on the default branch (schedule, dispatch, hand-fix push), not PR runs.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && contains('schedule workflow_dispatch push', github.event.workflow_run.event)
      && (github.event.workflow_run.event != 'push' || startsWith(github.event.workflow_run.head_commit.message, 'Fixture handfix')) }}
    runs-on: ubuntu-latest
    env:
      BASELINE_REF: ${{ vars.BASELINE_REF != '' && vars.BASELINE_REF || 'baseline' }}
      WORKFLOW_PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve baseline ref
        id: baseline
        run: |
          git fetch --tags origin
          git fetch origin "${BASELINE_REF}" --depth=1 || true
          if git rev-parse --verify --quiet "origin/${BASELINE_REF}^{commit}"; then
            echo "ref=origin/${BASELINE_REF}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "${BASELINE_REF}^{commit}"; then
            echo "ref=${BASELINE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "Baseline ref '${BASELINE_REF}' not found."
            exit 1
          fi
      - name: Check for changes since baseline
        id: diff
        run: |
          if git diff --quiet "${{ steps.baseline.outputs.ref }}...HEAD"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Every scenario changes main (update commit or hand-fix commit); no change means it did nothing.
      - name: Require a change since baseline
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "::error::The run did not change the default branch; the scenario did not take effect."
          exit 1
      - name: Verify updated versions
        if: github.event.workflow_run.event != 'push'
        run: python3 .github/scripts/verify_updated_versions.py
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify release, tags and images
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          git fetch --tags origin
          if [ "${RUN_EVENT}" = "push" ]; then
            scenario=handfix
          elif [[ "${RUN_TITLE}" == *"(dependency)"* ]]; then
            scenario=dependency
          else
            scenario=main
          fi
          python3 .github/scripts/verify_release.py "$scenario"
      # Tags/releases the run or the scenario seed created: reachable from HEAD, not from the baseline.
      - name: Delete scenario releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(git tag --merged HEAD --no-merged "${{ steps.baseline.outputs.ref }}")"
          if [ -z "$tags" ]; then
            echo "No tags found on the scenario commits."
            exit 0
          fi
          for tag in $tags; do
            echo "Deleting release/tag $tag"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
            else
              echo "Release for tag '$tag' not found; deleting tag only."
              git push --delete origin "$tag"
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true
          done
      - name: Reset default branch to baseline
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}" --depth=1

          workflow_diff="$(git diff --name-only "origin/${DEFAULT_BRANCH}" "${{ steps.baseline.outputs.ref }}" -- '.github/workflows/*')"
          if [ -n "$workflow_diff" ] && [ -z "${WORKFLOW_PUSH_TOKEN}" ]; then
            echo "Reset would update workflow files:"
            echo "$workflow_diff"
            echo "ERROR: Reset requires repository secret WORKFLOW_PUSH_TOKEN with permission to update workflows."
            echo "Provide a token with workflows write access (classic PAT: repo + workflow, or equivalent fine-grained/App permissions including Workflows: write)."
            exit 1
          fi

          if [ -n "${WORKFLOW_PUSH_TOKEN}" ]; then
            git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git checkout -B "${DEFAULT_BRANCH}" "${{ steps.baseline.outputs.ref }}"
          git push --force origin "${DEFAULT_BRANCH}"
